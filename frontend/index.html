<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biro Umum & Rumah Tangga</title>
  <!-- Tailwind tetap sebagai enhancement; CSS lokal menjadi sumber tampilan utama. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: '#0f172a',
            'primary-focus': '#1e293b',
            accent: '#2563eb',
            'surface-subtle': '#f8fafc',
            'border-light': '#e2e8f0',
          },
        },
      },
    };
  </script>

  <style id="biro-umum-fallback">
    html,body,#root{margin:0;min-height:100%;width:100%;}
    body{background:#f5f7fb;color:#1e293b;font-family:Inter,Arial,sans-serif;}
    button,input,select,textarea{font:inherit;}
    button{cursor:pointer;}
    .app-shell-bg{min-height:100vh;background:#f5f7fb;}
    .app-shell-bg>.ml-56{min-height:100vh;margin-left:15rem;}
    .app-main{min-height:100vh;box-sizing:border-box;padding:28px;background:#f5f7fb;}
    .menu-page{color:#1e293b;}
    .menu-hero{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 24px;border-radius:24px;color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(15,23,42,.10);}
    .menu-hero h1{margin:0;color:#fff!important}.menu-hero p{margin:.35rem 0 0;color:rgba(255,255,255,.86)!important}.menu-kicker{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.18em;opacity:.85;margin-bottom:7px}.menu-hero-icon{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.20)}
    .menu-kendaraan .menu-hero{background:linear-gradient(135deg,#0f766e,#14b8a6)}.menu-pemeliharaan .menu-hero{background:linear-gradient(135deg,#166534,#22c55e)}.menu-pengadaan .menu-hero{background:linear-gradient(135deg,#9a3412,#f97316)}.menu-ruang-rapat .menu-hero{background:linear-gradient(135deg,#6b21a8,#a855f7)}.menu-dashboard .menu-hero{background:linear-gradient(135deg,#334155,#64748b)}.menu-settings .menu-hero{background:linear-gradient(135deg,#475569,#94a3b8)}
    .menu-page .bg-white,.menu-page .bg-white\/75,.menu-page .bg-white\/80,.menu-page .bg-white\/85,.menu-page .bg-white\/90{background:#fff!important;color:#1e293b;}
    .menu-page .text-slate-900,.menu-page .text-slate-800,.menu-page h1,.menu-page h2,.menu-page h3,.menu-page h4{color:#172033!important}.menu-page .text-slate-700{color:#475569!important}.menu-page .text-slate-600,.menu-page .text-slate-500{color:#64748b!important}.menu-page .text-slate-400{color:#94a3b8!important}
    .menu-page table{width:100%;border-collapse:collapse}.menu-page thead{background:#f1f5f9!important}.menu-page td,.menu-page th{padding:10px 12px;color:inherit}.menu-page tr{border-color:#e2e8f0!important}.menu-page tr:hover{background:#f8fafc!important}
    .menu-page input:not([type=radio]):not([type=checkbox]),.menu-page select,.menu-page textarea{background:#fff!important;color:#1e293b!important;border:1px solid #cbd5e1!important;border-radius:10px;}
    .menu-page input::placeholder,.menu-page textarea::placeholder{color:#94a3b8!important}
    @media(max-width:900px){.app-shell-bg>.ml-56{margin-left:0}.app-main{padding:16px}.menu-hero{padding:18px}.menu-hero-icon{display:none}}
  </style>
  <style>
    * { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    ::selection { background: #c7d2fe; color: #312e81; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
  </style>
</head>
<body class="text-slate-800 font-sans antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

# =====================================================================
#  Header keamanan untuk halaman web (frontend/dist), dipakai nginx.conf.example.
#  Salin ke: /etc/nginx/snippets/biro-umum-security-headers.conf
#  (Response /api sudah diberi header serupa oleh backend, lihat backend/src/middleware/security.js.)
# =====================================================================

# Paksa HTTPS selama 1 tahun (browser tidak mau lagi dibuka lewat http://).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy: browser hanya boleh menjalankan script & memuat data dari domain sendiri.
# Jadi kalau suatu saat ada celah XSS, script penyerang tidak bisa dimuat dari luar / mengirim token keluar.
#  - style 'unsafe-inline' : tag <style> kecil di index.html & atribut style dari React
#  - img data:/blob:       : foto kendaraan & pratinjau gambar sebelum upload
#  - frame-src blob:       : pratinjau PDF (DocumentViewer)
# Kalau frontend & API beda domain, tambahkan domain API di connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# no-referrer: alamat halaman (termasuk /reset-password) tidak pernah dikirim ke situs lain.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
